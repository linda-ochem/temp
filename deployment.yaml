apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-deployment
  labels:
    app: temp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temp
  template:
    metadata:
      labels:
        app: temp
    spec:
      containers:
      - name: temp-container
        image: docker.io/cleowoman/mytemp
        ports:
        - containerPort: 5173

---

apiVersion: v1
kind: Service
metadata:
  name: temp-service
spec:
  selector:
    app: temp
  ports:
    - protocol: TCP
      port: 5173
      targetPort: 5173
  type: LoadBalancer

